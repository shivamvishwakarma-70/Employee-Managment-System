<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>
    <link rel="stylesheet" type="text/css" th:href="@{/styles.css}"> <!-- 1. naam thik kiya -->
</head>
<body>
	
    <div class="container"> <!-- box bada karne ke liye -->
        <h1>Employee Form</h1>
        
        <form th:action="@{/save}" th:object="${employee}" method="post" >
            <input type="hidden" th:field="*{id}"/>
   
            <div>
                <label>First Name: </label>
                <input type="text" th:field="*{firstName}" required />
            </div>
            <div>
                <label>Last Name: </label>
                <input type="text" th:field="*{lastName}" required />
            </div>
            <div>
                <label>Image URL: </label>
                <input type="text" th:field="*{imageUrl}" required />
            </div>
            <div th:if="*{imageUrl}">
                <img th:src="*{imageUrl}" width="100" height="100" style="border-radius:8px; margin-top:10px;"/>
            </div>
            <div>
                <label>Email: </label>
                <input type="email" th:field="*{email}" required />
            </div>
            <div>
                <label>Salary: </label>
                <input type="number" th:field="*{salary}" required/>
            </div>
            <div>
                <label>Department: </label>
                <select th:field="*{department.id}" required>
                    <option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.name}"></option> <!-- 2. space thik kiya -->
                </select>
                <a class="button" href="/departments/add">Create New Department</a> <!-- 3. space thik kiya -->
            </div>
            <div>
                <button type="submit" class="button">Save</button> <!-- button ko bhi class di -->
            </div>
        </form>
        <a class="button" href="/employees">Back to employee list</a> <!-- 3. space thik kiya -->
    </div>
    
</body>
</html>
